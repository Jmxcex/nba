services:
  # ==========================================
  # APACHE KAFKA (KRaft Mode Oficial - Sin Zookeeper)
  # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: nba-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - nba_network

  # ==========================================
  # KAFKA UI (Monitoreo visual en navegador: http://localhost:8085)
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nba-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: NBA-Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - nba_network

  # ==========================================
  # POSTGRESQL (Serving Layer / Gold Data Mart)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: nba-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: nba_gold
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nba_network

volumes:
  kafka_data:
  postgres_data:

networks:
  nba_network:
    driver: bridge
